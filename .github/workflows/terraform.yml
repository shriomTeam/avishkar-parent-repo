name: Terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

# One run at a time, so two applies never fight over the state lock.
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  TF_ENV: prod
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    environment: production # holds GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET for this environment
    env:
      # Sign-in credentials. Terraform stores the secret in Secret Manager; Cloud Run reads it from there.
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config=envs/${TF_ENV}.backend.hcl
      - run: terraform plan -input=false -lock-timeout=60s -var-file=envs/${TF_ENV}.tfvars -out=tfplan
      - name: Publish plan summary
        run: |
          {
            echo '### Terraform plan (`'"${TF_ENV}"'`)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Only main uploads the plan; apply uses exactly this file.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production # holds GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET for this environment
    env:
      # Sign-in credentials. Terraform stores the secret in Secret Manager; Cloud Run reads it from there.
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform
      - run: terraform init -input=false -backend-config=envs/${TF_ENV}.backend.hcl
      - run: terraform apply -input=false -lock-timeout=60s tfplan
      - name: Record result
        run: |
          {
            echo '### Terraform apply (`'"${TF_ENV}"'`) succeeded'
            terraform output
          } >> "$GITHUB_STEP_SUMMARY"
