[project]
name = "clinic-admin"
version = "0.1.0"
description = "Operator console: list clinics, switch features on and off, suspend a clinic. Own login, own Cloud Run service."
requires-python = ">=3.12"
dependencies = [
    "clinic-core",
    "clinic-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
]

[project.scripts]
clinic-admin = "clinic_admin.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_admin"]
