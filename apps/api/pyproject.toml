[project]
name = "clinic-api"
version = "0.1.0"
description = "FastAPI backend. Discovers installed features and mounts each behind its entitlement check."
requires-python = ">=3.12"
dependencies = [
    "clinic-core",
    "clinic-db",
    "clinic-integrations",
    "clinic-engagement",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_api"]
