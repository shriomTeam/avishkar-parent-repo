[project]
name = "clinic-worker"
version = "0.1.0"
description = "BullMQ worker: feature jobs, event fan-out, outbox relay, engagement sends, schedules."
requires-python = ">=3.12"
dependencies = [
    "clinic-core",
    "clinic-db",
    "clinic-engagement",
    "clinic-knowledge",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bullmq>=2.11",
]

[project.scripts]
clinic-worker = "clinic_worker.main:run"
clinic-ingest = "clinic_worker.knowledge_ingest:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_worker"]
