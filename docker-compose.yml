services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: clinic_owner
      POSTGRES_PASSWORD: clinic_owner
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_owner -d clinic"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
