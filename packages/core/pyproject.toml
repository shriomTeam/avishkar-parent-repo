[project]
name = "clinic-core"
version = "0.1.0"
description = "Platform kernel: settings, tenant-scoped DB sessions, feature contract, entitlements, events, audit, queue."
requires-python = ">=3.12"
dependencies = [
    "clinic-db",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "bullmq>=2.11",
    "authlib>=1.6,<2",
    "joserfc>=1.6,<2",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_core"]
