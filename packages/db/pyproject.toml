[project]
name = "clinic-db"
version = "0.1.0"
description = "Single source of truth for the database: every table, every schema, one Alembic migration stream."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_db"]
