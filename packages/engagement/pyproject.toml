[project]
name = "clinic-engagement"
version = "0.1.0"
description = "Shared outreach engine: multi-step SMS/email sequences, consent + quiet-hours checks, messaging providers."
requires-python = ">=3.12"
dependencies = [
    "clinic-core",
    "clinic-db",
    "httpx>=0.28",
    "cryptography>=43",
    "google-cloud-tasks>=2.16",
    "google-auth[requests]>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_engagement"]
