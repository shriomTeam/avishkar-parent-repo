[project]
name = "clinic-feature-blueprints"
version = "0.1.0"
description = "Patient Blueprint Report: the clinic's top buying profiles, computed from core data."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db"]

[project.entry-points."clinic.features"]
blueprints = "clinic_blueprints.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_blueprints"]
