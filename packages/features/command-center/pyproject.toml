[project]
name = "clinic-feature-command-center"
version = "0.1.0"
description = "The Command Center: Revenue, conversion, provider performance, attribution and forecasting."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db"]

[project.entry-points."clinic.features"]
command_center = "clinic_command_center.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_command_center"]
