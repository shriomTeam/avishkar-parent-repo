[project]
name = "clinic-feature-lead-response"
version = "0.1.0"
description = "The 60-Second Response System: Contacts every new lead in under a minute, then follows up until they book."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db"]

[project.entry-points."clinic.features"]
lead_response = "clinic_lead_response.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_lead_response"]
