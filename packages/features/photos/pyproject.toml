[project]
name = "clinic-feature-photos"
version = "0.1.0"
description = "Before/After Photo Pipeline: Consent-tracked photo capture through approved publishing."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db"]

[project.entry-points."clinic.features"]
photos = "clinic_photos.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_photos"]
