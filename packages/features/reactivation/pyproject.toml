[project]
name = "clinic-feature-reactivation"
version = "0.1.0"
description = "Dormant Revenue Finder: finds lapsed patients and runs a reactivation sequence until they book."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db", "clinic-engagement"]

# This entry point is how the API and worker discover the feature.
[project.entry-points."clinic.features"]
reactivation = "clinic_reactivation.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_reactivation"]
