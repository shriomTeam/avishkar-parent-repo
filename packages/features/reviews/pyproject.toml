[project]
name = "clinic-feature-reviews"
version = "0.1.0"
description = "The 5-Star Machine: Requests reviews from happy patients and routes unhappy ones privately."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db"]

[project.entry-points."clinic.features"]
reviews = "clinic_reviews.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_reviews"]
