[project]
name = "clinic-feature-reviews"
version = "0.1.0"
description = "The 5-Star Machine: post-appointment ratings, with a Google review invite for 4- and 5-star responses."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db", "clinic-engagement"]

[project.entry-points."clinic.features"]
reviews = "clinic_reviews.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_reviews"]
