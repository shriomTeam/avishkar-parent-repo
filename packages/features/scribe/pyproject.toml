[project]
name = "clinic-feature-scribe"
version = "0.1.0"
description = "The Chart-While-You-Talk System: Captures the visit conversation and drafts structured notes for provider review."
requires-python = ">=3.12"
dependencies = ["clinic-core", "clinic-db"]

[project.entry-points."clinic.features"]
scribe = "clinic_scribe.feature:feature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_scribe"]
