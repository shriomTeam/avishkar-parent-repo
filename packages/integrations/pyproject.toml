[project]
name = "clinic-integrations"
version = "0.1.0"
description = "Client data onboarding: any source (CSV, Excel, client DB, EMR API) -> staging -> per-tenant mapping -> canonical core tables."
requires-python = ">=3.12"
dependencies = [
    "clinic-core",
    "clinic-db",
    "openpyxl>=3.1",
    "pydantic[email]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_integrations"]
