[project]
name = "clinic-knowledge"
version = "0.1.0"
description = "Shared knowledge base: store a clinic's documents, split them into searchable passages and look them up by meaning and keywords."
requires-python = ">=3.12"
dependencies = [
    "clinic-core",
    "clinic-db",
    "google-genai>=1.0",
    "google-cloud-tasks>=2.16",
    "google-cloud-storage>=2.18",
    "pgvector>=0.3.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_knowledge"]
