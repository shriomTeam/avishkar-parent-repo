# uv workspace root. Every Python package in the monorepo is a member, so the
# whole backend shares one lockfile and one virtualenv (.venv at the repo root).
[project]
name = "always-on-clinic"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "clinic-api",
    "clinic-worker",
    "clinic-db",
    "clinic-core",
    "clinic-integrations",
    "clinic-engagement",
    "clinic-knowledge",
    "clinic-feature-reactivation",
    "clinic-feature-blueprints",
    "clinic-feature-lead-response",
    "clinic-feature-reviews",
    "clinic-feature-voice-receptionist",
    "clinic-feature-scribe",
    "clinic-feature-command-center",
    "clinic-feature-photos",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/db", "packages/core", "packages/integrations", "packages/engagement", "packages/knowledge", "packages/features/*"]

[tool.uv.sources]
clinic-api = { workspace = true }
clinic-worker = { workspace = true }
clinic-db = { workspace = true }
clinic-core = { workspace = true }
clinic-integrations = { workspace = true }
clinic-engagement = { workspace = true }
clinic-knowledge = { workspace = true }
clinic-feature-reactivation = { workspace = true }
clinic-feature-blueprints = { workspace = true }
clinic-feature-lead-response = { workspace = true }
clinic-feature-reviews = { workspace = true }
clinic-feature-voice-receptionist = { workspace = true }
clinic-feature-scribe = { workspace = true }
clinic-feature-command-center = { workspace = true }
clinic-feature-photos = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"packages/db/migrations/versions/*" = ["E501"]  # autogenerated

[tool.ruff.lint.isort]
known-first-party = ["clinic_*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Architectural boundaries, enforced in CI with `pnpm boundaries`.
[tool.importlinter]
root_packages = [
    "clinic_api", "clinic_worker", "clinic_db", "clinic_core", "clinic_integrations", "clinic_engagement", "clinic_knowledge",
    "clinic_reactivation", "clinic_blueprints", "clinic_lead_response", "clinic_reviews",
    "clinic_voice_receptionist", "clinic_scribe", "clinic_command_center", "clinic_photos",
]

[[tool.importlinter.contracts]]
name = "Platform layers: apps -> features -> platform services -> core -> db"
type = "layers"
layers = [
    "clinic_api | clinic_worker",
    "clinic_reactivation | clinic_blueprints | clinic_lead_response | clinic_reviews | clinic_voice_receptionist | clinic_scribe | clinic_command_center | clinic_photos",
    "clinic_integrations | clinic_engagement | clinic_knowledge",
    "clinic_core",
    "clinic_db",
]

[[tool.importlinter.contracts]]
name = "Features never import each other (talk through core tables + events)"
type = "independence"
modules = [
    "clinic_reactivation", "clinic_blueprints", "clinic_lead_response", "clinic_reviews",
    "clinic_voice_receptionist", "clinic_scribe", "clinic_command_center", "clinic_photos",
]

[[tool.importlinter.contracts]]
name = "Apps discover features via entry points, never import them directly"
type = "forbidden"
source_modules = ["clinic_api", "clinic_worker"]
forbidden_modules = [
    "clinic_reactivation", "clinic_blueprints", "clinic_lead_response", "clinic_reviews",
    "clinic_voice_receptionist", "clinic_scribe", "clinic_command_center", "clinic_photos",
]
